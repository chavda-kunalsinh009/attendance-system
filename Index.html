  <style>
    :root{--brand:#4F46E5;--brand-soft:#EEF2FF;--ink:#0F172A;--text:#334155;--muted:#64748B;--line:#E2E8F0;--bg:#F4F6FB;--card:#fff;--ok:#15803D;--bad:#B91C1C;--radius:16px;--shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.06)}

    .shell{max-width:1180px;margin:0 auto;padding:24px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--card);padding:16px 20px;border-radius:var(--radius);box-shadow:var(--shadow)}
    .brand{display:flex;align-items:center;gap:12px;min-width:0}.logo{width:42px;height:42px;border-radius:12px;object-fit:cover;background:var(--brand-soft)}h1,h2,h3,p{margin-top:0}.brand h1{font-size:18px;margin:0}.muted{color:var(--muted)}.small{font-size:12px}

    .btn{border:0;border-radius:11px;padding:12px 14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}.primary{background:var(--brand);color:white}.secondary{background:var(--brand-soft);color:var(--brand)}.danger{background:#FEE2E2;color:#B91C1C}.btn:disabled{opacity:.55;cursor:not-allowed}.full{width:100%}.actions{display:flex;gap:10px;margin-top:12px}.actions>*{flex:1}
    .notice{padding:12px 14px;border-radius:10px;background:#F1F5F9;color:var(--text);margin-top:14px;line-height:1.5}.notice.ok{background:#DCFCE7;color:#166534}.notice.error{background:#FEE2E2;color:#991B1B}.profile{display:flex;gap:12px;align-items:center;padding:14px;background:#F8FAFC;border:1px solid var(--line);border-radius:12px;margin-top:14px}.avatar{width:42px;height:42px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:17px}.profile strong{display:block;margin-bottom:4px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px}.stat{padding:16px;background:#F8FAFC;border:1px solid var(--line);border-radius:12px}.stat span{font-size:12px;color:var(--muted);display:block}.stat strong{font-size:24px;display:block;margin-top:7px}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}.toolbar h2{margin:0}.toolbar .actions{margin:0}.toolbar input{width:auto;min-width:160px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;background:white;white-space:nowrap}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);font-size:12px}th{background:#F8FAFC;color:var(--muted);font-weight:700}tr:last-child td{border-bottom:0}.status{display:inline-block;border-radius:999px;padding:5px 8px;background:#E2E8F0;color:#334155;font-weight:700;font-size:11px}.status.Present{background:#DCFCE7;color:#166534}.status.Late,.status.Absent{background:#FEE2E2;color:#991B1B}.status.Half-Day{background:#FEF3C7;color:#92400E}.admin-tabs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:18px 0;padding:10px;background:#eef2f7;border:1px solid #e2e8f0;border-radius:14px}.admin-tabs button{border:1px solid transparent;padding:11px 15px;border-radius:10px;background:transparent;color:#526078;font-weight:700;transition:background .18s,color .18s,box-shadow .18s}.admin-tabs button:hover{background:#fff;color:var(--brand)}.admin-tabs button.active{background:var(--brand);color:white;box-shadow:0 4px 12px rgba(79,70,229,.2)}.admin-tabs #logoutAdmin{margin-left:auto;background:#fff1f2;color:#be123c;border-color:#ffe4e6}.admin-tabs #logoutAdmin:hover{background:#ffe4e6}.admin-actions{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin:18px 0 8px}.admin-actions #logoutAdmin{display:inline-flex!important;align-items:center;justify-content:center;gap:8px;background:#fff1f2;color:#be123c;border:1px solid #fecdd3;border-radius:10px;padding:10px 15px;font-weight:800;min-height:42px;visibility:visible;opacity:1}.admin-actions #logoutAdmin:hover{background:#ffe4e6}.hidden{display:none!important}
    #adminPanel .card{border:1px solid #e8edf5;box-shadow:0 8px 26px rgba(15,23,42,.045)}#adminPanel .stats{margin-top:14px}#adminPanel .toolbar{padding-bottom:12px;border-bottom:1px solid #edf0f5}#adminPanel table tbody tr:hover{background:#fafcff}.admin-session-note{font-size:12px;color:#64748b;margin:0 0 12px}.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.foot{text-align:center;color:var(--muted);font-size:12px;padding:24px}
    /* Admin dashboard polish: deliberate contrast, clear hierarchy, responsive KPI cards */
    .admin-boot{max-width:520px;margin:36px auto;text-align:center;padding:36px 24px;color:#334155}
    .admin-boot .spinner{width:30px;height:30px;border:3px solid #e0e7ff;border-top-color:var(--brand);border-radius:50%;margin:0 auto 16px;animation:adminSpin .8s linear infinite}
    @keyframes adminSpin{to{transform:rotate(360deg)}}
    #adminPanel{margin-top:20px}
    #adminPanel .admin-actions{margin:0 0 12px}
    #adminPanel .admin-tabs{margin:0 0 20px;background:#fff;border-color:#e4e9f2;box-shadow:0 3px 14px rgba(15,23,42,.035)}
    #adminPanel .admin-tabs button{padding:11px 16px;color:#475569}
    #adminPanel .admin-tabs button.active{background:#4338ca;color:#fff}
    #adminContent .card{padding:24px}
    #adminContent .toolbar h2{font-size:22px;letter-spacing:-.035em;color:#111827}
    #adminContent .dashboard-intro{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}

    #adminContent .dashboard-intro p{color:#64748b;margin:0;line-height:1.55}
    #adminContent .stats{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}

    #adminContent .stat strong{font-size:28px;color:#111827;font-weight:800;letter-spacing:-.04em;margin-top:10px}

    #adminContent td .muted,.employee-secondary{color:#64748b!important;font-size:11px;font-weight:600;display:inline-block;margin-top:4px}
    #adminContent tbody tr:nth-child(even) td{background:#fbfcfe}

    #adminContent .status{padding:6px 10px;font-size:11px;letter-spacing:.01em}

    #adminContent .status.Late{background:#ffedd5;color:#9a3412}
    #adminContent .status.Absent{background:#fee2e2;color:#991b1b}
    #adminContent .status.Half-Day{background:#fef3c7;color:#854d0e}
    #adminContent .status.Leave{background:#dbeafe;color:#1d4ed8}
    #adminContent .dashboard-toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
    #adminContent .dashboard-toolbar input{min-width:165px}
    #adminContent .section-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 12px}
    #adminContent .section-heading h3{margin:0;color:#0f172a;font-size:15px}
    #adminPanel .settings-grid{gap:0 18px}
    #adminPanel .field span{color:#334155}
    @media(max-width:800px){#adminContent .stats{grid-template-columns:repeat(2,minmax(0,1fr))}#adminContent .dashboard-intro{flex-direction:column}#adminPanel .admin-tabs{overflow-x:auto;flex-wrap:nowrap}#adminPanel .admin-tabs button{white-space:nowrap}}
    @media(max-width:800px){.shell{padding:12px}.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.topbar{align-items:flex-start}.settings-grid{grid-template-columns:1fr}}@media(max-width:420px){.work-timer-value{font-size:24px}.actions{flex-direction:column}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:21px}}

    /* Consistent readable text for employee attendance/history tables too */
    .workspace-shell table td{color:#1e293b;background:#fff;font-weight:500}
    .workspace-shell table td strong{color:#0f172a;font-weight:800}
    .workspace-shell table td .muted{color:#64748b!important;font-weight:600}
    .workspace-shell table th{color:#475569;background:#f1f5f9}
    .workspace-shell .status.Half-Day{background:#fef3c7;color:#854d0e}
    /* Employee workspace: clean enterprise dashboard inspired by modern HR portals */
    .shell:has(.workspace-shell){max-width:1440px;padding:0;background:#f6f8fb;min-height:100vh}
    .workspace-shell{display:grid;grid-template-columns:238px minmax(0,1fr);min-height:100vh}
    .workspace-nav{background:#fff;border-right:1px solid #e7ebf2;padding:22px 14px;display:flex;flex-direction:column;gap:8px}
    .workspace-nav .nav-title{font-size:11px;letter-spacing:.09em;color:#8b95a7;font-weight:800;padding:20px 12px 7px;text-transform:uppercase}
    .workspace-nav .nav-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;color:#526078;font-weight:600;text-decoration:none;cursor:pointer}
    .workspace-nav .nav-item.active,.workspace-nav .nav-item:hover{background:#e9f7f5;color:#087f79}
    .nav-glyph{width:20px;height:20px;flex:0 0 20px;display:inline-grid;place-items:center}.nav-glyph svg{width:19px;height:19px;display:block;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.workspace-nav .nav-item.active .nav-glyph{color:#087f79}
    .workspace-main{min-width:0;padding:24px 30px 32px}
    .workspace-top{display:flex;align-items:center;justify-content:space-between;gap:14px;background:#fff;padding:14px 20px;border:1px solid #edf0f5;border-radius:14px;margin-bottom:24px}
    .workspace-top .brand h1{font-size:16px}.workspace-top .logo{width:36px;height:36px}
    .workspace-greeting{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin:10px 0 22px}
    .workspace-greeting h2{font-size:26px;margin:0 0 8px;letter-spacing:-.04em}.workspace-greeting p{margin:0;color:#758198}
    .workspace-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);gap:18px;align-items:start}
    .workspace-grid>div{display:contents}
    .workspace-grid>div>section.card{display:none}
    .workspace-grid>div>section.card.workspace-active{display:block;grid-column:1/-1}
    .workspace-grid.overview-mode #attendance.workspace-active,.workspace-grid.overview-mode #department.workspace-active{grid-column:auto}
    .workspace-grid.overview-mode #attendance.workspace-active{grid-column:1}
    .workspace-grid.overview-mode #department.workspace-active{grid-column:2}
    .workspace-main .card{border:1px solid #edf0f5;box-shadow:0 3px 14px rgba(25,45,80,.035);padding:20px;margin-bottom:18px;border-radius:14px}
    .attendance-hero{background:linear-gradient(135deg,#087f79,#12a69a);color:white;border:0!important}
    .attendance-hero .muted,.attendance-hero p{color:#d9f5f1}.attendance-hero .btn{background:#fff;color:#087f79;border:0}
    .work-timer{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:16px;padding:16px 18px;border-radius:14px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25)}
    .work-timer-label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;color:#d9f5f1}.work-timer-value{font-size:30px;font-weight:800;letter-spacing:.06em;font-variant-numeric:tabular-nums;margin-top:5px}.work-timer-meta{font-size:12px;color:#d9f5f1;margin-top:4px}.timer-dot{width:10px;height:10px;border-radius:50%;background:#fbbf24;box-shadow:0 0 0 5px rgba(251,191,36,.18);flex:0 0 10px}.timer-dot.running{background:#86efac;box-shadow:0 0 0 5px rgba(134,239,172,.18)}
    .employee-live-card{display:flex;align-items:center;gap:12px;padding:13px 14px;margin-top:14px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12);border-radius:13px}.employee-live-avatar{width:44px;height:44px;flex:0 0 44px;display:grid;place-items:center;border-radius:50%;background:#fff;color:#087f79;font-weight:800;font-size:17px}.employee-live-info{min-width:0;flex:1}.employee-live-info strong{display:block;font-size:14px;color:#fff;margin-bottom:4px}.employee-live-info .employee-live-meta{font-size:12px;color:#d9f5f1;overflow-wrap:anywhere}.employee-live-status{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:rgba(134,239,172,.18);border:1px solid rgba(134,239,172,.42);padding:6px 9px;color:#dcfce7;font-size:11px;font-weight:800;white-space:nowrap}.employee-live-status .status-light{width:7px;height:7px;border-radius:50%;background:#86efac}.employee-live-status.is-out{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.25);color:#f1f5f9}.employee-live-status.is-out .status-light{background:#cbd5e1}
    /* High-contrast employee identity card: readable against the attendance hero background */
    .attendance-hero .employee-live-card{background:#ffffff;border:1px solid #dcefeb;box-shadow:0 4px 14px rgba(0,45,42,.12)}
    .attendance-hero .employee-live-info strong{color:#102a2a!important;font-weight:800}
    .attendance-hero .employee-live-card{background:#fff!important;border:2px solid #0f766e!important;box-shadow:0 8px 22px rgba(15,118,110,.16)!important}
    .attendance-hero .employee-live-info strong{color:#0f172a!important;font-size:15px!important;font-weight:900!important;letter-spacing:.01em}
    .attendance-hero .employee-live-info .employee-live-meta{color:#334155!important;font-weight:700!important}
    .attendance-hero .employee-live-avatar{background:#ccfbf1!important;color:#115e59!important;border:2px solid #5eead4!important;font-size:18px!important}
    .attendance-hero .employee-live-status{background:#dcfce7;border-color:#bbf7d0;color:#166534}
    .attendance-hero .employee-live-status.is-out{background:#f1f5f9;border-color:#cbd5e1;color:#475569}
    .attendance-hero .employee-live-status .status-light{background:#16a34a}
    .attendance-hero .employee-live-status.is-out .status-light{background:#94a3b8}
    @media(max-width:460px){.employee-live-card{align-items:flex-start;flex-wrap:wrap}.employee-live-status{margin-left:56px}}
    .workspace-main .profile{background:#f8fafc}.member-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
    .member-item{display:flex;align-items:center;gap:10px;border:1px solid #edf0f5;border-radius:12px;padding:12px;min-width:0;background:#fff}
    .member-item .avatar{flex:0 0 40px}.member-item strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}

    /* Quick links: compact, aligned action panel */
    .quick-links-card h2{font-size:17px;letter-spacing:-.02em;margin:0 0 5px}
    .quick-links-intro{font-size:12px;color:#758198;line-height:1.55;margin:0 0 14px}
    .quick-links-list{display:grid;gap:8px}

    .quick-link-copy{min-width:0;flex:1}.quick-link-copy strong{display:block;font-size:12px;font-weight:700;line-height:1.4}.quick-link-copy span{display:block;font-size:11px;color:#7b8798;margin-top:3px;line-height:1.4}
    .quick-link-arrow{color:#94a3b8;font-size:18px;margin-left:auto}
    .quick-links-card .notice{font-size:11px;margin-top:14px}

    @media(max-width:980px){.workspace-shell{grid-template-columns:190px minmax(0,1fr)}.workspace-main{padding:18px}.workspace-grid{grid-template-columns:1fr}}
    @media(max-width:680px){.shell:has(.workspace-shell){padding:0}.workspace-shell{grid-template-columns:1fr}.workspace-nav{border-right:0;border-bottom:1px solid #e7ebf2;padding:10px;display:flex;flex-direction:row;overflow:auto}.workspace-nav .nav-title{display:none}.workspace-nav .nav-item{white-space:nowrap;padding:10px}.workspace-main{padding:12px}.workspace-greeting{display:block}.workspace-greeting h2{font-size:22px}.workspace-top{padding:12px}.member-list{grid-template-columns:1fr}.workspace-nav .nav-item span:last-child{font-size:12px}}
  
    /* Premium enterprise palette: midnight navy, deep teal and warm neutral surfaces */
    :root{--brand:#0f766e;--brand-soft:#e6f4f1;--ink:#102033;--text:#34465a;--muted:#64748b;--line:#dbe4eb;--bg:#f3f6f8;--card:#ffffff;--ok:#15803d;--bad:#b91c1c;--radius:16px;--shadow:0 8px 28px rgba(16,32,51,.065)}

    .profile-empty strong{color:#102033;font-size:14px}
    .profile-empty-icon{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:#e6f4f1;color:#0f766e;font-size:23px;font-weight:800}
    .attendance-hero .employee-live-card{background:#fff!important;border:2px solid #8ee0d2!important;box-shadow:0 8px 22px rgba(4,25,30,.22)!important;padding:15px 16px!important}
    .attendance-hero .employee-live-avatar{background:#dff3ee!important;color:#0f766e!important;border:1px solid #c5e9e1}
    .attendance-hero .employee-live-info strong{color:#102033!important;font-size:16px!important;font-weight:900!important;letter-spacing:0!important}
    .attendance-hero .employee-live-info .employee-live-meta{color:#33465a!important;font-size:12px!important;font-weight:750!important;line-height:1.6}
    .attendance-hero .employee-live-status{background:#dcfce7!important;color:#166534!important;border-color:#bbf7d0!important}
    .attendance-hero .employee-live-status.is-out{background:#f1f5f9!important;color:#334155!important;border-color:#cbd5e1!important}
    .attendance-hero .employee-live-status .status-light{background:#16a34a!important}
    .attendance-hero .employee-live-status.is-out .status-light{background:#64748b!important}
    .workspace-shell .profile{background:#f8fbfc;border-color:#dbe7ed}
    input:focus,select:focus{border-color:#0f766e;box-shadow:0 0 0 3px rgba(15,118,110,.14)}
    @media(max-width:800px){.workspace-shell{grid-template-columns:1fr}.workspace-nav{position:static;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;padding:12px}.workspace-nav .nav-title{grid-column:1/-1;padding:8px 10px}.workspace-nav>div:last-child{display:none}.workspace-main{padding:14px}.profile-details-grid{grid-template-columns:1fr}}

  </style>
</head>
<body>
<div id="app"></div>
<script>
  const CONFIG = <?!= config ?>;
  const app = document.getElementById('app');
  document.documentElement.style.setProperty('--brand', CONFIG.brandColor || '#4F46E5');
  document.documentElement.style.setProperty('--brand-soft', '#EEF2FF');

  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function(c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function callServer(name, args) {
    return new Promise(function(resolve, reject) {
      if (!google || !google.script || !google.script.run) {
        reject(new Error('Apps Script connection is unavailable. Open the deployed web app URL.'));
        return;
      }
      const runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(function(err) {
        reject(new Error(err && err.message ? err.message : String(err)));
      });
      runner[name].apply(runner, args || []);
    });
  }
  function header(admin) {
    const logo = CONFIG.logoUrl ? '<img class="logo" src="' + esc(CONFIG.logoUrl) + '" alt="Logo">' : '<div class="logo" style="display:grid;place-items:center;color:var(--brand);font-weight:800">A</div>';
    return '<header class="topbar"><div class="brand">' + logo + '<div><h1>' + esc(CONFIG.businessName || 'Attendance System') + '</h1><div class="muted small">' + (admin ? 'Attendance administration' : 'Employee attendance portal') + '</div></div></div><span class="pill">' + (admin ? 'ADMIN' : 'EMPLOYEE') + '</span></header>';
  }
  function showMessage(id, message, kind) {
    const el = document.getElementById(id);
    if (!el) return;
    el.className = 'notice' + (kind ? ' ' + kind : '');
    el.textContent = message;
    el.classList.remove('hidden');
  }
  function statusClass(status) { return String(status || 'Absent').replace(/\s+/g, '-'); }

  function renderEmployee() {
    app.innerHTML = '<main class="shell"><div class="workspace-shell">' +
      '<aside class="workspace-nav"><div class="nav-title">WORKSPACE</div>' +
      '<a class="nav-item active" href="#overview" data-target="overview"><span class="nav-glyph"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7"></path><path d="M5 9v12h14V9M9 21v-7h6v7"></path></svg></span><span>My Space</span></a>' +
      '<a class="nav-item" href="#attendance" data-target="attendance"><span class="nav-glyph"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></span><span>Attendance</span></a>' +
      '<a class="nav-item" href="#requests" data-target="requests"><span class="nav-glyph"><svg viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z"></path><path d="M14 3v5h5M10 13h5M10 17h5"></path></svg></span><span>My Requests</span></a>' +
      '<a class="nav-item" href="#regularizationSection" data-target="regularizationSection"><span class="nav-glyph"><svg viewBox="0 0 24 24"><path d="M12 8v4l3 2"></path><circle cx="12" cy="12" r="9"></circle><path d="M8 3 6 5M16 3l2 2"></path></svg></span><span>Attendance Regularization</span></a>' +
      '<a class="nav-item" href="#wfhSection" data-target="wfhSection"><span class="nav-glyph"><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7"></path><path d="M5 10v10h14V10M9 20v-6h6v6"></path></svg></span><span>Work From Home (WFH)</span></a>' +
      '<a class="nav-item" href="#leaveSection" data-target="leaveSection"><span class="nav-glyph"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 10h18M8 14h3"></path></svg></span><span>Leave Management</span></a>' +
      '<a class="nav-item" href="#notificationsSection" data-target="notificationsSection"><span class="nav-glyph"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"></path></svg></span><span>Notifications</span></a>' +
      '<a class="nav-item" href="#department" data-target="department"><span class="nav-glyph"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"></circle><path d="M3 20v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 4v2"></path></svg></span><span>Department Members</span></a>' +
      '<a class="nav-item" href="#profile" data-target="profile"><span class="nav-glyph"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></span><span>My Profile</span></a>' +
      '<a class="nav-item" href="#holidays" data-target="holidays"><span class="nav-glyph"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 10h18M8 14h3"></path></svg></span><span>Holidays</span></a>' +
      '<div style="margin-top:auto;padding:12px;color:#9aa3b2;font-size:11px">' + esc(CONFIG.businessName || 'Employee Portal') + '</div></aside>' +
      '<section class="workspace-main"><header class="workspace-top">' + header(false) + '<div class="pill">● Employee Portal</div></header>' +
      '<div class="workspace-greeting" id="overview"><div><h2 id="welcomeTitle">Welcome to My Space</h2><p id="welcomeSub">Your workday, attendance and team — all in one place.</p></div><div class="pill" id="todayDate"></div></div>' +
      '<div class="workspace-grid"><div>' +
      '<section class="card attendance-hero" id="attendance"><h2>Attendance</h2><p>Record your workday check-in and check-out.</p>' +
      '<div id="employeeProfile" class="hidden"></div>' +
      '<div id="loginFields"><label class="field"><span style="color:#e1fffb">Employee ID</span><input id="empId" placeholder="Enter Employee ID" autocomplete="username"></label>' +
      '<label class="field"><span style="color:#e1fffb">Employee PIN</span><input id="empPin" type="password" placeholder="Enter your PIN" autocomplete="current-password"></label>' +
      '<button class="btn full" id="checkBtn" type="button">Open My Space</button></div>' +
      '<div id="attendanceActions" class="hidden"><label class="field"><span style="color:#e1fffb">Today’s Work Mode</span><select id="workMode"><option value="Office">Office</option><option value="WFH">Work From Home (approved only)</option></select></label><p class="small" style="color:#dbeafe;margin:0 0 10px">WFH can be selected only for dates approved by Admin. Office remains the default.</p><div class="actions"><button class="btn" id="loginBtn" type="button">✓ Check In</button><button class="btn" id="logoutBtn" type="button">↗ Check Out</button></div></div>' +
      '<div id="employeeLiveCard" class="employee-live-card hidden" aria-live="polite"><div class="employee-live-avatar" id="employeeLiveAvatar">?</div><div class="employee-live-info"><strong id="employeeLiveName">Employee</strong><div class="employee-live-meta"><span id="employeeLiveId">Employee ID</span> · <span id="employeeLiveRole">Designation</span></div></div><span class="employee-live-status is-out" id="employeeLiveStatus"><span class="status-light"></span><span id="employeeLiveStatusText">Not checked in</span></span></div>' +
      '<div id="workTimer" class="work-timer"><div><div class="work-timer-label">Today’s live work timer</div><div class="work-timer-value" id="workTimerValue">00:00:00</div><div class="work-timer-meta" id="workTimerMeta">Open My Space, then check in to start your timer.</div></div><span class="timer-dot" id="workTimerDot"></span></div>' +
      '<div id="empMessage" class="notice hidden" role="status"></div><div id="todaySummary" class="notice">Sign in with your employee ID and PIN to view today’s attendance.</div><h3 style="margin:20px 0 8px;font-size:14px">Recent Attendance</h3><div id="attendanceHistory"><div class="notice">Verify your employee details to load attendance history.</div></div></section>' +
      '<section class="card" id="department"><div class="toolbar"><h2>Department Members</h2><span class="pill" id="departmentLabel">Your team</span></div><p class="muted small">Active colleagues in your department.</p><div id="departmentMembers"><div class="notice">Verify your employee details to load your department members.</div></div></section>' +
      '<section class="card" id="regularizationSection"><h2>Attendance Regularization</h2><p class="muted small">Request a correction for missed or incorrect attendance. Admin approval is required.</p><div id="regMessage" class="notice hidden" role="status"></div><form id="regularizationForm"><label class="field"><span>Attendance Date</span><input id="regDate" name="date" type="date" required></label><label class="field"><span>Request Type</span><select id="regType" name="type" required><option>Missed Login / Check-in</option><option>Missed Logout / Check-out</option><option>Incorrect Attendance Time</option><option>Absent but Worked</option></select></label><label class="field"><span>Requested Login Time</span><input name="loginTime" type="time"></label><label class="field"><span>Requested Logout Time</span><input name="logoutTime" type="time"></label><label class="field"><span>Reason</span><input name="reason" required maxlength="500" placeholder="Explain why correction is needed"></label><button class="btn secondary full" type="submit">Submit Regularization Request</button></form></section>' +
      '<section class="card" id="requests"><h2>My Requests</h2><p class="muted small">Track the status and remarks for your attendance correction requests.</p><div id="myRequestsList"><div class="notice">Sign in to view your requests.</div></div></section>' +
      '<section class="card" id="wfhSection"><h2>Work From Home (WFH)</h2><p class="muted small">Submit a date-range request. WFH is enabled only after Admin approval.</p><div id="wfhMessage" class="notice hidden" role="status"></div><div id="wfhTodayStatus" class="notice">Sign in to check your approved work mode.</div><form id="wfhForm"><div class="settings-grid"><label class="field"><span>Start Date</span><input id="wfhStartDate" name="startDate" type="date" required></label><label class="field"><span>End Date</span><input id="wfhEndDate" name="endDate" type="date" required></label></div><label class="field"><span>Reason for WFH</span><input name="reason" maxlength="500" minlength="5" required placeholder="Explain why you need to work from home"></label><button class="btn secondary full" type="submit">Submit WFH Request</button></form><h3 style="margin:20px 0 8px;font-size:14px">My WFH Requests</h3><div id="myWFHRequests"><div class="notice">Sign in to view your WFH requests.</div></div></section>' +
      '<section class="card" id="leaveSection"><h2>Leave Management</h2><p class="muted small">Request leave and track approval status. Attendance changes only after Admin approval.</p><div id="leaveMessage" class="notice hidden" role="status"></div><form id="leaveForm"><label class="field"><span>Leave Type</span><select name="leaveType" required><option>Casual Leave</option><option>Sick Leave</option><option>Earned Leave</option><option>Unpaid Leave</option><option>Other</option></select></label><div class="settings-grid"><label class="field"><span>Start Date</span><input id="leaveStartDate" name="startDate" type="date" required></label><label class="field"><span>End Date</span><input id="leaveEndDate" name="endDate" type="date" required></label></div><label class="field"><span>Reason</span><input name="reason" maxlength="500" minlength="5" required placeholder="Reason for leave"></label><button class="btn secondary full" type="submit">Submit Leave Request</button></form><h3 style="margin:20px 0 8px;font-size:14px">My Leave Requests</h3><div id="myLeaveRequests"><div class="notice">Sign in to view leave requests.</div></div></section>' +
      '<section class="card" id="notificationsSection"><h2>Notifications <span class="pill" id="notificationCount">0 unread</span></h2><p class="muted small">Updates about your WFH and leave requests.</p><div id="employeeNotifications"><div class="notice">Sign in to view notifications.</div></div></section>' +
      '</div><div>' +
      '<section class="card"><h2>My Action Items</h2><p class="muted small">Keep your attendance and employee details up to date.</p><div class="member-item"><div class="avatar">◷</div><div><strong>Attendance for today</strong><div class="muted">Check in when your workday starts.</div></div></div><div class="member-item" style="margin-top:10px"><div class="avatar">✓</div><div><strong>Profile details</strong><div class="muted">Contact HR if your details need updating.</div></div></div></section>' +
      '<section class="card" id="profile"><h2>My Profile</h2><div class="muted small">Your employee details appear after verification.</div><div id="profileDetails" class="profile-details-card"><div class="profile-empty"><span class="profile-empty-icon">◎</span><strong>Profile not loaded yet</strong><span>Verify your Employee ID and PIN in Attendance to view your details here.</span></div></div></section>' +
      '<section class="card" id="holidays"><div class="toolbar"><h2>Holidays</h2><span class="pill">Company calendar</span></div><p class="muted small">Upcoming and published holidays.</p><div id="holidayList"><div class="notice">Loading holidays…</div></div></section>' +
      '<section class="card quick-links-card" aria-labelledby="quickLinksTitle"><h2 id="quickLinksTitle">Quick Links</h2><p class="quick-links-intro">Jump straight to the tools you use most.</p><div class="quick-links-list">' +
      '<a class="quick-link" href="#attendance"><span class="quick-link-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></span><span class="quick-link-copy"><strong>Attendance</strong><span>Check in or check out</span></span><span class="quick-link-arrow" aria-hidden="true">›</span></a>' +
      '<a class="quick-link" href="#requests"><span class="quick-link-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l4 4v14H7z"></path><path d="M14 3v5h5M10 13h5M10 17h5"></path></svg></span><span class="quick-link-copy"><strong>My Requests</strong><span>Request an attendance correction</span></span><span class="quick-link-arrow" aria-hidden="true">›</span></a>' +
      '<a class="quick-link" href="' + esc((CONFIG.webAppUrl || '').replace(/\/$/, '') + '?page=admin') + '"><span class="quick-link-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.2 1.1 2.4-.1 1.1 2.2 2 1.3-.5 2.4.8 2.3-1.7 1.7-.5 2.4-2.4.5-1.7 1.7-2.3-.8-2.4.5-1.3-2-2.2-1.1.1-2.4L3 12l.8-2.3-.5-2.4 2-1.3 1.1-2.2 2.4.1z"></path><circle cx="12" cy="12" r="3"></circle></svg></span><span class="quick-link-copy"><strong>Admin Dashboard</strong><span>Administration and reports</span></span><span class="quick-link-arrow" aria-hidden="true">›</span></a>' +
      '</div><div class="notice"><strong>Security tip</strong><br>Keep your Employee ID and PIN private. Attendance data is stored in your connected Google Sheet.</div></section>' +
      '</div></div><div class="foot">' + esc(CONFIG.businessName || 'Employee Portal') + ' · ' + esc(CONFIG.timeZone || 'Asia/Kolkata') + '</div></section></div></main>';

    let verifiedEmployee = null;
    let workTimerInterval = null;
    document.getElementById('todayDate').textContent = new Date().toLocaleDateString('en-IN', {weekday:'short',day:'numeric',month:'short',year:'numeric',timeZone:CONFIG.timeZone||'Asia/Kolkata'});
    function setWorkspacePage(pageId) {
      const grid = document.querySelector('.workspace-grid');
      if (!grid) return;
      grid.classList.toggle('overview-mode', pageId === 'overview');
      grid.querySelectorAll('section.card').forEach(function(card) { card.classList.remove('workspace-active'); });
      if (pageId === 'overview') {
        ['attendance','department'].forEach(function(id) {
          const card = document.getElementById(id);
          if (card) card.classList.add('workspace-active');
        });
      } else {
        const selected = document.getElementById(pageId);
        if (selected && grid.contains(selected)) selected.classList.add('workspace-active');
      }
      const greeting = document.getElementById('overview');
      if (greeting) greeting.classList.toggle('hidden', pageId !== 'overview');
      document.querySelectorAll('.workspace-nav .nav-item[data-target]').forEach(function(item) {
        item.classList.toggle('active', item.getAttribute('data-target') === pageId);
      });
      try { history.replaceState(null, '', '#' + pageId); } catch (e) {}
    }
    document.querySelectorAll('.workspace-nav .nav-item[data-target]').forEach(function(link) {
      link.addEventListener('click', function(ev) {
        ev.preventDefault();
        setWorkspacePage(link.getAttribute('data-target'));
      });
    });
    document.querySelectorAll('.quick-link[href^="#"]').forEach(function(link) {
      link.addEventListener('click', function(ev) {
        ev.preventDefault();
        const targetId = link.getAttribute('href').slice(1);
        setWorkspacePage(targetId === 'attendance' ? 'attendance' : targetId === 'requests' ? 'requests' : targetId);
      });
    });
    setWorkspacePage('overview');
    loadHolidays();
    document.getElementById('checkBtn').addEventListener('click', verifyEmployee);
    document.getElementById('loginBtn').addEventListener('click', function(){ attendanceAction('login'); });
    document.getElementById('logoutBtn').addEventListener('click', function(){ attendanceAction('logout'); });
    document.getElementById('regDate').value = new Date().toLocaleDateString('en-CA', {timeZone: CONFIG.timeZone || 'Asia/Kolkata'});
    const todayIso = new Date().toLocaleDateString('en-CA', {timeZone: CONFIG.timeZone || 'Asia/Kolkata'});
    document.getElementById('wfhStartDate').value = todayIso;
    document.getElementById('wfhEndDate').value = todayIso;
    document.getElementById('wfhStartDate').min = todayIso;
    document.getElementById('wfhEndDate').min = todayIso;
    document.getElementById('wfhStartDate').addEventListener('change', function(){ document.getElementById('wfhEndDate').min = this.value || todayIso; if(document.getElementById('wfhEndDate').value < this.value) document.getElementById('wfhEndDate').value = this.value; });
    document.getElementById('regularizationForm').addEventListener('submit', submitRegularization);
    document.getElementById('wfhForm').addEventListener('submit', submitWFHRequest);
    document.getElementById('leaveForm').addEventListener('submit', submitLeaveRequest);
    document.getElementById('leaveStartDate').value = todayIso;
    document.getElementById('leaveEndDate').value = todayIso;
    document.getElementById('leaveStartDate').min = todayIso;
    document.getElementById('leaveEndDate').min = todayIso;
    document.getElementById('leaveStartDate').addEventListener('change', function(){ document.getElementById('leaveEndDate').min=this.value||todayIso; if(document.getElementById('leaveEndDate').value<this.value) document.getElementById('leaveEndDate').value=this.value; });

    async function verifyEmployee() {
      const id = document.getElementById('empId').value.trim();
      const pin = document.getElementById('empPin').value;
      if (!id || (CONFIG.requirePin && !pin)) return showMessage('empMessage', 'Enter your Employee ID and PIN.', 'error');
      setBusy(true);
      try {
        const result = await callServer('getEmployeeToday', [id, pin]);
        if (!result.ok) {
          verifiedEmployee = null;
          document.getElementById('employeeProfile').classList.add('hidden');
          document.getElementById('attendanceActions').classList.add('hidden');
          showMessage('empMessage', result.message || 'Verification failed.', 'error'); return;
        }
        verifiedEmployee = {id:id, pin:pin, employee:result.employee, allowLogout:result.allowLogout};
        document.getElementById('loginFields').classList.add('hidden');
        document.getElementById('employeeProfile').innerHTML = '<div class="profile"><div class="avatar">' + esc(result.employee.name.charAt(0).toUpperCase()) + '</div><div><strong>' + esc(result.employee.name) + '</strong><div class="muted small">' + esc(result.employee.id) + ' · ' + esc(result.employee.designation || result.employee.department) + '</div></div></div>';
        document.getElementById('employeeProfile').classList.remove('hidden');
        const liveCard = document.getElementById('employeeLiveCard');
        const employeeName = result.employee.name || 'Employee';
        document.getElementById('employeeLiveAvatar').textContent = employeeName.charAt(0).toUpperCase();
        document.getElementById('employeeLiveName').textContent = employeeName;
        document.getElementById('employeeLiveId').textContent = 'ID: ' + (result.employee.id || id);
        document.getElementById('employeeLiveRole').textContent = result.employee.designation || result.employee.department || 'Team Member';
        liveCard.classList.remove('hidden');
        document.getElementById('attendanceActions').classList.remove('hidden');
        document.getElementById('logoutBtn').classList.toggle('hidden', !result.allowLogout);
        document.getElementById('welcomeTitle').textContent = 'Good day, ' + result.employee.name.split(' ')[0];
        document.getElementById('welcomeSub').textContent = (result.employee.designation || 'Team Member') + (result.employee.department ? ' · ' + result.employee.department : '') + ' — here is your workday overview.';
        document.getElementById('profileDetails').innerHTML = '<div class="profile-details-head"><div class="profile-details-avatar">' + esc((result.employee.name || 'E').charAt(0).toUpperCase()) + '</div><div><strong>' + esc(result.employee.name || 'Employee') + '</strong><div class="muted small">Verified employee profile</div></div></div><div class="profile-details-grid"><div class="profile-field"><span>Employee ID</span><strong>' + esc(result.employee.id || '—') + '</strong></div><div class="profile-field"><span>Designation</span><strong>' + esc(result.employee.designation || '—') + '</strong></div><div class="profile-field"><span>Department</span><strong>' + esc(result.employee.department || '—') + '</strong></div></div>';
        const record = result.record;
        const liveStatus = document.getElementById('employeeLiveStatus');
        const liveStatusText = document.getElementById('employeeLiveStatusText');
        const isCurrentlyIn = !!(record && record.loginTime && !record.logoutTime);
        liveStatus.classList.toggle('is-out', !isCurrentlyIn);
        liveStatusText.textContent = isCurrentlyIn ? 'In · Working' : (record && record.logoutTime ? 'Out · Completed' : 'Not checked in');
        document.getElementById('todaySummary').textContent = record ? 'Today: ' + (record.status || 'Attendance started') + ' · Check in: ' + (record.loginTime || 'Not recorded') + ' · Check out: ' + (record.logoutTime || 'Not recorded') + ' · Working hours: ' + (record.hours || 0) : 'No attendance has been recorded for today yet.';
        showMessage('empMessage', 'Signed in successfully. Your attendance status is up to date.', 'ok');
        updateButtons(record);
        updateWorkTimer(record);
        await Promise.all([loadDepartmentMembers(), loadAttendanceHistory(), loadMyRequests(), loadWFHStatus(), loadLeaveStatus(), loadEmployeeNotifications()]);
      } catch (err) { showMessage('empMessage', err.message, 'error'); }
      finally { setBusy(false); }
    }

    async function loadAttendanceHistory() {
      const target=document.getElementById('attendanceHistory'); if(!verifiedEmployee || !target) return;

    function updateWorkTimer(record) {
      const value = document.getElementById('workTimerValue');
      const meta = document.getElementById('workTimerMeta');
      const dot = document.getElementById('workTimerDot');
      if (!value || !meta || !dot) return;
      if (workTimerInterval) { clearInterval(workTimerInterval); workTimerInterval = null; }
      const loginTime = record && record.loginTime ? String(record.loginTime) : '';
      const logoutTime = record && record.logoutTime ? String(record.logoutTime) : '';
      if (!loginTime) {
        value.textContent = '00:00:00';
        meta.textContent = 'Check in to start tracking your work time.';
        dot.classList.remove('running');
        return;
      }
      function timeToSeconds(t) {
        const parts = String(t || '').split(':');
        if (parts.length < 2) return null;
        const h = Number(parts[0]), m = Number(parts[1]), sec = Number(parts[2] || 0);
        if (![h,m,sec].every(Number.isFinite)) return null;
        return h * 3600 + m * 60 + sec;
      }
      const startSeconds = timeToSeconds(loginTime);
      const endSeconds = logoutTime ? timeToSeconds(logoutTime) : null;
      if (startSeconds === null) { meta.textContent = 'Check-in recorded at ' + loginTime; return; }
      function render() {
        const now = new Date();
        const nowSeconds = Number(new Intl.DateTimeFormat('en-GB',{timeZone:CONFIG.timeZone||'Asia/Kolkata',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).format(now).split(':').reduce(function(acc,v){return acc*60+Number(v);},0));
        let elapsed = (logoutTime && endSeconds !== null ? endSeconds : nowSeconds) - startSeconds;
        if (elapsed < 0) elapsed += 86400;
        elapsed = Math.max(0, elapsed);
        const hh = String(Math.floor(elapsed / 3600)).padStart(2,'0');
        const mm = String(Math.floor((elapsed % 3600) / 60)).padStart(2,'0');
        const ss = String(elapsed % 60).padStart(2,'0');
        value.textContent = hh + ':' + mm + ':' + ss;
      }
      render();
      if (logoutTime) {
        meta.textContent = 'Checked in at ' + loginTime + ' · Checked out at ' + logoutTime + ' · Timer stopped';
        dot.classList.remove('running');
      } else {
        meta.textContent = 'Checked in at ' + loginTime + ' · Timer running';
        dot.classList.add('running');
        workTimerInterval = setInterval(render, 1000);
      }
    }

      try{const date=new Date().toLocaleDateString('en-CA',{timeZone:CONFIG.timeZone||'Asia/Kolkata'});const d=await callServer('getManagerDashboard',[id,pin,date]);if(!d.ok){target.innerHTML='';return showMessage('managerMessage',d.message||'Manager access denied.','error');}
        showMessage('managerMessage','Signed in as '+d.manager.name+'. Team data is limited to assigned employees.','ok');
        target.innerHTML='<section class="card"><div class="dashboard-intro"><div><h2>Team Attendance</h2><p class="muted">'+esc(d.manager.name)+' · '+esc(d.date)+'</p></div><input id="managerDate" type="date" value="'+esc(d.date)+'"></div><div class="stats">'+managerStat('Team members',d.kpi.total)+managerStat('Present',d.kpi.present)+managerStat('Late',d.kpi.late)+managerStat('Absent',d.kpi.absent)+'</div><div class="table-wrap"><table><thead><tr><th>Employee</th><th>Department</th><th>Check-in</th><th>Check-out</th><th>Hours</th><th>Status</th></tr></thead><tbody>'+d.daily.map(function(r){return '<tr><td><strong>'+esc(r.name)+'</strong><br><span class="employee-secondary">'+esc(r.employeeId)+'</span></td><td>'+esc(r.department||'—')+'</td><td>'+esc(r.loginTime||'—')+'</td><td>'+esc(r.logoutTime||'—')+'</td><td>'+esc(r.hours||0)+'</td><td><span class="status '+statusClass(r.status)+'">'+esc(r.status)+'</span></td></tr>';}).join('')+'</tbody></table></div></section>';
        document.getElementById('managerDate').addEventListener('change',async function(){const fresh=await callServer('getManagerDashboard',[id,pin,this.value]);if(fresh.ok){d.daily=fresh.daily;d.kpi=fresh.kpi;d.date=fresh.date;loadTeamRender(fresh);}});
        function loadTeamRender(fresh){const c=document.getElementById('managerContent');c.innerHTML='<section class="card"><h2>Team Attendance · '+esc(fresh.date)+'</h2><div class="stats">'+managerStat('Team members',fresh.kpi.total)+managerStat('Present',fresh.kpi.present)+managerStat('Late',fresh.kpi.late)+managerStat('Absent',fresh.kpi.absent)+'</div><div class="table-wrap"><table><thead><tr><th>Employee</th><th>Department</th><th>Check-in</th><th>Check-out</th><th>Hours</th><th>Status</th></tr></thead><tbody>'+fresh.daily.map(function(r){return '<tr><td><strong>'+esc(r.name)+'</strong><br><span class="employee-secondary">'+esc(r.employeeId)+'</span></td><td>'+esc(r.department||'—')+'</td><td>'+esc(r.loginTime||'—')+'</td><td>'+esc(r.logoutTime||'—')+'</td><td>'+esc(r.hours||0)+'</td><td><span class="status '+statusClass(r.status)+'">'+esc(r.status)+'</span></td></tr>';}).join('')+'</tbody></table></div></section>';}}
      catch(e){target.innerHTML='';showMessage('managerMessage',e.message||'Could not load team dashboard.','error');}
    }
  }
  if (CONFIG.page === 'admin') renderAdmin();
  else if (CONFIG.page === 'manager') renderManager();
  else renderEmployee();
</script>
</body>
</html>
